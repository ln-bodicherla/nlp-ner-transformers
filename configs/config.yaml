model:
  base_model: "bert-base-uncased"
  max_length: 512

labels:
  - O
  - B-PER
  - I-PER
  - B-ORG
  - I-ORG
  - B-LOC
  - I-LOC
  - B-MISC
  - I-MISC

training:
  num_epochs: 5
  batch_size: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  output_dir: "./models/ner_model"
